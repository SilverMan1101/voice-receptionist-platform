name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest  # pin a stable version
        ports:
          - 6333:6333
        options: >-
          --health-cmd="timeout 5 bash -c '</dev/tcp/127.0.0.1/6333'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: receptionist_user
          POSTGRES_PASSWORD: receptionist_password
          POSTGRES_DB: receptionist_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest (reporting coverage)
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
          DATABASE_URL: postgresql://receptionist_user:receptionist_password@localhost:5432/receptionist_db
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: dummy_key
        run: |
          # Run tests and report coverage but do not fail on coverage threshold
          pytest --cov=services --cov-report=xml --cov-report=term-missing tests/

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Placeholder Build Step
        run: echo "Build stage - e.g., Docker image build and push"
